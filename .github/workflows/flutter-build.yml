# .github/workflows/flutter-build.yml
# Run it from GitHub -> Actions tab -> "Flutter build" -> Run workflow.
# Download the .apk (and iOS output) from the run's "Artifacts" section.
#
# Project facts:
#   - Flutter 3.24.3  (Dart 3.5.3 — satisfies the Dart 3.2.3+ requirement)
#   - Android applicationId: com.magentoegyptpro.ajstore  (matches google-services.json)
#   - Release keystore: configs/ajstore-keystore.jks  alias=ajstore
#   - iOS bundle: com.magentoegypt.ajstore   (matches GoogleService-Info.plist)

name: Flutter build

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags: ['v*']            # also triggers on version tags like v1.0.0

env:
  FLUTTER_VERSION: '3.24.3'   # Dart 3.5.3 — change here to update everywhere

jobs:
  # ---------------------------------------------------------------------------
  # ANDROID — produces signed release APKs + a debug APK for quick testing
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (warnings only — does not fail the build)
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS — compiles on a real Mac runner.
  # Without Apple signing secrets -> unsigned build (not installable, but proves
  # the code compiles). Add the 4 secrets below to get a real signed IPA.
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd ios && pod install && cd ..

      # -----------------------------------------------------------------------
      # SIGNED IPA — uncomment when you have an Apple Developer account.
      #
      # Add these 4 secrets in:
      #   GitHub repo -> Settings -> Secrets and variables -> Actions
      #
      #   BUILD_CERTIFICATE_BASE64      base64 of your .p12 distribution cert
      #                                 (on Mac: base64 -i cert.p12 | pbcopy)
      #   P12_PASSWORD                  password you set when exporting the .p12
      #   PROVISIONING_PROFILE_BASE64   base64 of your .mobileprovision file
      #                                 (on Mac: base64 -i profile.mobileprovision | pbcopy)
      #   KEYCHAIN_PASSWORD             any throwaway string e.g. "build1234"
      # -----------------------------------------------------------------------

      # - name: Import Apple signing assets
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      #     PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERT=$RUNNER_TEMP/cert.p12
      #     PROFILE=$RUNNER_TEMP/profile.mobileprovision
      #     KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
      #     echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT
      #     echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
      #     security set-keychain-settings -lut 21600 $KEYCHAIN
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
      #     security import $CERT -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN
      #     security list-keychain -d user -s $KEYCHAIN
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     cp $PROFILE ~/Library/MobileDevice/Provisioning\ Profiles/

      # - name: Build signed IPA
      #   run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # - name: Upload IPA
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ios-ipa
      #     path: build/ios/ipa/*.ipa
      #     if-no-files-found: error

      # Unsigned build — active until signing secrets are added above.
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Runner-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/ipa/Runner-unsigned.ipa
          if-no-files-found: error
