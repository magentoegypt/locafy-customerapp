# .github/workflows/flutter-build.yml
# Place this file at  <repo-root>/.github/workflows/flutter-build.yml
# Run it from GitHub  ->  Actions tab  ->  "Flutter build"  ->  Run workflow.
# Download the .apk (and iOS output) from the run's "Artifacts" section.
#
# Project facts baked in:
#   - Flutter 3.10.6 (pinned in .fvmrc)
#   - Android applicationId: com.magentoegyptpro.ajstore  (matches google-services.json)
#   - Release keystore android/android.jks is committed; signing config is in
#     android/app/build.gradle.kts, so the release APK signs with no extra setup.
#   - iOS bundle: com.magentoegypt.ajstore (matches GoogleService-Info.plist)

name: Flutter build

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags: ['v*']            # also build when you push a tag like v1.0.0

jobs:
  # ---------------------------------------------------------------------------
  # ANDROID  ->  produces app-release.apk  (and a debug apk for quick testing)
  # This job is fully self-contained: it WILL output an installable .apk.
  # ---------------------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'      # AGP 8.x needs JDK 17; lower this if Gradle complains

      - name: Set up Flutter 3.10.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Debug APK — installs on any device with "unknown sources", no signing concerns.
      - name: Build debug APK
        run: flutter build apk --debug

      # Release APK — signed with the committed android/android.jks.
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS  ->  by default only VERIFIES the app compiles (unsigned).
  # A real, installable .ipa REQUIRES an Apple Developer account + a signing
  # certificate (.p12) and provisioning profile. See the commented block below.
  # ---------------------------------------------------------------------------
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.10.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: cd ios && pod install && cd ..

      # Unsigned compile check — proves the iOS build is healthy.
      # This does NOT produce a distributable .ipa (no signing).
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      # ----- TO PRODUCE A REAL .ipa, you need an Apple Developer account. -----
      # 1) In GitHub repo Settings -> Secrets and variables -> Actions, add:
      #      BUILD_CERTIFICATE_BASE64   (base64 of your Apple distribution .p12)
      #      P12_PASSWORD               (password for that .p12)
